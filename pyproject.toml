[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eit"
version = "0.1.0"
description = "Error Injection Tool — inline Ethernet fault injector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
eit = "eit.cli:main"
eitd = "eit.daemon:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eit = ["builtin_profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
